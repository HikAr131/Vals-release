name: 问题反馈
description: 提交 Vals 内测问题，并附本机导出的诊断包
title: "[反馈] "
body:
  - type: markdown
    attributes:
      value: |
        此处为公开回报，内容和附件所有人可见。请勿提交账号、私人路径、密钥或未经检查的完整截图。
        Vals 不会自动上传资料，请在「关于我们 → 日志与反馈」导出诊断包后自行附上。
  - type: input
    id: version
    attributes:
      label: Vals 版本
      placeholder: "例如：0.0.1（内测）"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      placeholder: "1. 打开手动调整\n2. 选择某个分辨率\n3. 点击应用"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与错误提示
      description: 请保留错误代码与数字状态码；说明是否黑屏、多久恢复。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断包与截图
      description: 将导出的诊断 ZIP 拖入此处；可另附检查过的截图。不要附游戏配置原文、账号或密钥。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容检查
      options:
        - label: 我已确认附件与截图不含账号、私人路径或密钥，并了解此回报公开可见。
          required: true
